<head>

  <script>
    MathJax = {
      tex: {
        inlineMath: [['$','$'],['\\(','\\)']],
        displayMath: [['$$','$$'],['\\[','\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.75;
    }

    /* ── Top header ─────────────────────────────────────── */
    #site-header {
      background: #fff;
      border-bottom: 2px solid #1a1a1a;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #site-header img {
      height: 40px;
      width: auto;
    }

    #site-header .header-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #site-header .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.2;
    }

    #site-header .header-sub {
      font-size: 12px;
      color: #555;
    }

    /* ── Top nav bar ─────────────────────────────────────── */
    #topnav {
      background: #f7f7f5;
      border-bottom: 1px solid #ddd;
      padding: 0 2rem;
      display: flex;
      gap: 0;
      overflow-x: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #topnav a {
      display: block;
      font-size: 13px;
      color: #444;
      text-decoration: none;
      padding: 0.6rem 1.1rem;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    #topnav a:hover { color: #1a1a1a; border-bottom-color: #aaa; }
    #topnav a.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 600; }

    /* ── Layout ──────────────────────────────────────────── */
    #page-wrap {
      display: flex;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 2rem;
      gap: 3rem;
    }

    /* ── Floating TOC (right side) ───────────────────────── */
    #toc-panel {
      width: 220px;
      flex-shrink: 0;
      position: sticky;
      top: 110px;
      align-self: flex-start;
      max-height: calc(100vh - 130px);
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
    }

    #toc-panel .toc-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #eee;
    }

    #toc-panel a {
      display: block;
      color: #555;
      text-decoration: none;
      padding: 2px 0 2px 0;
      line-height: 1.45;
      transition: color 0.15s;
    }

    #toc-panel a.h3 { padding-left: 0.9rem; font-size: 11px; color: #777; }
    #toc-panel a.h4 { padding-left: 1.6rem; font-size: 11px; color: #999; }
    #toc-panel a:hover { color: #1a1a1a; }
    #toc-panel a.active { color: #1a1a1a; font-weight: 600; }

    /* ── Main content ────────────────────────────────────── */
    #content {
      flex: 1;
      min-width: 0;
      max-width: 720px;
    }

    /* ── Typography ──────────────────────────────────────── */
    #content p {
      font-size: 16px;
      line-height: 1.85;
      text-align: justify;
      hyphens: auto;
      margin-bottom: 1.15rem;
      color: #1a1a1a;
    }

    #content h1 {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      line-height: 1.2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 0.4rem;
    }

    #content h2 {
      font-size: clamp(18px, 2.5vw, 23px);
      font-weight: 700;
      margin: 2.5rem 0 0.75rem;
      line-height: 1.25;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #content h3 {
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 700;
      margin: 2rem 0 0.6rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #content h4 {
      font-size: 15px;
      font-weight: 700;
      margin: 1.5rem 0 0.5rem;
      font-style: italic;
      font-family: Georgia, serif;
    }

    #content a { color: #1a1a1a; text-decoration: underline; }
    #content a:hover { opacity: 0.65; }

    #content ul, #content ol {
      padding-left: 1.75rem;
      margin-bottom: 1.15rem;
    }

    #content li {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 0.2rem;
    }

    #content hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 2.5rem 0;
    }

    #content blockquote {
      border-left: 3px solid #1a1a1a;
      padding-left: 1.25rem;
      margin: 1.5rem 0;
      font-style: italic;
      color: #444;
    }

    /* ── Figures and images ───────────────────────────────── */
    #content figure {
      margin: 2rem 0;
      text-align: center;
    }

    #content figure img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    #content img {
      display: block;
      margin-left: auto;
      margin-right: auto;
      max-width: 100%;
      height: auto;
      }

    #content figure {
      text-align: center;
      margin: 2rem auto;
    }

    #content figcaption {
      text-align: center;
    }

    #content p > img {
      display: block;
      margin: 1.5rem auto;
    }
    #content .img-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }

    #content .img-row img {
      flex: 1;
      min-width: 0;
      max-width: 48%;
      height: auto;
      display: block;
      margin: 0;
    }
    #content figcaption strong {
      font-style: normal;
      font-weight: 700;
      color: #1a1a1a;
    }

    /* ── Tables ──────────────────────────────────────────── */
    #content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 1.5rem 0 2rem;
      display: block;
      overflow-x: auto;
    }

    #content th {
      background: #f4f4f2;
      padding: 9px 14px;
      text-align: left;
      font-weight: 700;
      border-top: 2px solid #1a1a1a;
      border-bottom: 1px solid #ccc;
    }

    #content td {
      padding: 8px 14px;
      border-bottom: 1px solid #e8e8e5;
      vertical-align: top;
      line-height: 1.55;
    }

    #content tr:last-child td { border-bottom: 2px solid #1a1a1a; }
    #content tr:hover td { background: #fafaf8; }

    /* ── Code ────────────────────────────────────────────── */
    #content pre {
      background: #f4f4f2;
      border-left: 3px solid #1a1a1a;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      font-size: 13px;
      margin-bottom: 1.5rem;
      font-family: 'SF Mono', 'Fira Mono', monospace;
    }

    #content code {
      font-family: 'SF Mono', 'Fira Mono', monospace;
      font-size: 0.87em;
      background: #f0f0ed;
      padding: 1px 5px;
      border-radius: 2px;
    }

    #content pre code { background: none; padding: 0; }

    /* ── Iframes / embeds ────────────────────────────────── */
    #content iframe,
    .embed-wrap iframe {
      width: 100%;
      border: none;
    }

    .iframe-16-9 {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin: 1.5rem 0;
    }

    .iframe-16-9 iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* ── Abbreviation tooltips ───────────────────────────── */
    abbr[data-title] {
      border-bottom: 1px dotted #888;
      cursor: help;
      text-decoration: none;
      position: relative;
    }

    abbr[data-title]:hover::after {
      content: attr(data-title);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 6px);
      transform: translateX(-50%);
      background: #1a1a1a;
      color: #fff;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Mobile ──────────────────────────────────────────── */
    #hamburger {
      display: none;
      position: fixed;
      top: 10px; right: 12px;
      z-index: 200;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 18px;
    }

    @media (max-width: 900px) {
      #toc-panel { display: none; }
      #page-wrap { padding: 2rem 1.25rem; gap: 0; }
      #content { max-width: 100%; }
      #content p, #content li { text-align: left; }
      #topnav { padding: 0 1rem; }
    }

    @media (max-width: 600px) {
      #site-header { padding: 0.75rem 1rem; }
      #content h1 { font-size: 22px; }
      #content h2 { font-size: 18px; }
    }
  </style>
</head>

<!-- Body -->
<div id="page-wrap">
  <main id="content">
    {{ content }}
  </main>

  <aside id="toc-panel">
    <div class="toc-title">On this page</div>
  </aside>
</div>


<script>
(function buildTOC(){
  const content = document.getElementById('content');
  const toc     = document.getElementById('toc-panel');
  const headings = content.querySelectorAll('h2, h3, h4');
  if(!headings.length || !toc) return;

  headings.forEach(h => {
    if(!h.id){
      h.id = h.textContent.toLowerCase()
               .replace(/[^a-z0-9\s]/g,'')
               .trim().replace(/\s+/g,'-');
    }
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if(h.tagName==='H3') a.className = 'h3';
    if(h.tagName==='H4') a.className = 'h4';
    a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(h.id)
        .scrollIntoView({ behavior:'smooth', block:'start' });
    });
    toc.appendChild(a);
  });

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        toc.querySelectorAll('a').forEach(a =>
          a.classList.toggle('active',
            a.getAttribute('href') === '#' + e.target.id));
      }
    });
  }, { rootMargin:'-10% 0px -80% 0px', threshold:0 });

  headings.forEach(h => obs.observe(h));
})();

</script>
