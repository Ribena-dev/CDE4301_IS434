
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:16px 20px;font-family:var(--font-sans)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ctrl-label{font-size:11px;color:var(--color-text-tertiary)}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .15s;user-select:none}
.pill.on{background:var(--color-background-primary);border-color:var(--color-text-primary);color:var(--color-text-primary)}
.sort-row{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.sort-btn{font-size:10px;padding:2px 8px;border-radius:4px;border:0.5px solid var(--color-border-tertiary);cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .15s}
.sort-btn.active{background:var(--color-background-primary);border-color:var(--color-text-primary);color:var(--color-text-primary)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--color-text-secondary)}
th .arr{display:inline-block;margin-left:3px;opacity:0.4;font-size:9px}
th.sorted .arr{opacity:1}
td{padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.sample-name{font-weight:500;color:var(--color-text-primary);font-size:12px}
.profile-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);color:var(--color-text-tertiary)}
.rq-bar-wrap{display:flex;align-items:center;gap:6px}
.rq-bar{height:6px;border-radius:3px;background:#1D9E75;opacity:0.6;transition:width .3s;min-width:2px}
.rq-val{font-size:11px;color:var(--color-text-primary);font-weight:500;min-width:36px}
.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px}
.badge.pass{background:#EAF3DE;color:#3B6D11}
.badge.warn{background:#FAEEDA;color:#854F0B}
.link-btn{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:4px;border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);cursor:pointer;background:var(--color-background-secondary);text-decoration:none;transition:all .15s}
.link-btn:hover{border-color:var(--color-border-secondary);color:var(--color-text-primary)}
.link-icon{font-size:9px;opacity:0.6}
.nc-val{font-size:11px;color:var(--color-text-secondary)}
.nc-good{color:#1D9E75;font-weight:500}
.nc-warn{color:#BA7517;font-weight:500}
.empty{padding:24px;text-align:center;font-size:12px;color:var(--color-text-tertiary)}
.legend{display:flex;gap:12px;margin-top:10px;font-size:10px;color:var(--color-text-tertiary)}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-dot{width:8px;height:8px;border-radius:2px}
</style>

<div class="wrap">
  <div class="controls">
    <span class="ctrl-label">Filter:</span>
    <span class="pill on" data-filter="all">All</span>
    <span class="pill" data-filter="Pd">Pd</span>
    <span class="pill" data-filter="Au">Au</span>
    <span class="pill" data-filter="DLC">DLC</span>
    <span class="ctrl-label" style="margin-left:8px">Sort by:</span>
    <span class="sort-btn active" data-sort="sample">Sample</span>
    <span class="sort-btn" data-sort="rq">Rq ↑</span>
    <span class="sort-btn" data-sort="rz">Rz ↑</span>
  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th data-col="sample">Sample <span class="arr">↕</span></th>
        <th data-col="profile">Profile <span class="arr">↕</span></th>
        <th data-col="rq">Rq (nm) <span class="arr">↕</span></th>
        <th data-col="ra">Ra (nm) <span class="arr">↕</span></th>
        <th data-col="rz">Rz (nm) <span class="arr">↕</span></th>
        <th>NC (q=0.5)</th>
        <th>Images</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#1D9E75;opacity:.6"></div> Rq bar scale: 0–2 nm</div>
    <div class="leg-item"><div class="leg-dot" style="background:#1D9E75"></div> NC > 0.9 (near-ideal)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#BA7517"></div> NC 0.7–0.9</div>
  </div>
</div>

<script>
const data = [
  {sample:'Pd 500 nm',  profile:'P1', rq:0.219, ra:0.176, rz:1.044,  afm:'afm/pd_si_500nm_2.png',   graph:'#graph-pd-p1'},
  {sample:'Au on Cr',   profile:'P1', rq:0.758, ra:0.546, rz:4.160,  afm:'#afm-auCr-p1', graph:'#graph-auCr-p1'},
  {sample:'Au on Cr',   profile:'P2', rq:0.866, ra:0.709, rz:4.347,  afm:'#afm-auCr-p2', graph:'#graph-auCr-p2'},
  {sample:'Au on Pd',   profile:'P1', rq:0.514, ra:0.413, rz:2.560,  afm:'#afm-auPd-p1', graph:'#graph-auPd-p1'},
  {sample:'Au on Pd',   profile:'P2', rq:1.271, ra:1.005, rz:6.875,  afm:'#afm-auPd-p2', graph:'#graph-auPd-p2'},
  {sample:'DLC on Pd',  profile:'P1', rq:1.707, ra:1.316, rz:11.510, afm:'#afm-dlcPd-p1', graph:'#graph-dlcPd-p1'},
  {sample:'DLC on Pd',  profile:'P2', rq:0.954, ra:0.764, rz:6.227,  afm:'#afm-dlcPd-p2', graph:'#graph-dlcPd-p2'},
  {sample:'DLC on Au',  profile:'P1', rq:1.526, ra:1.287, rz:8.436,  afm:'#afm-dlcAu-p1', graph:'#graph-dlcAu-p1'},
  {sample:'DLC on Au',  profile:'P2', rq:1.943, ra:1.650, rz:9.444,  afm:'#afm-dlcAu-p2', graph:'#graph-dlcAu-p2'},
];

const RQ_MAX = 2.0;
let currentFilter = 'all';
let currentSort = 'sample';
let sortDir = 1;

function nc(qz, rq){ return Math.exp(-qz*qz*rq*rq); }

function render(){
  let rows = [...data];

  if(currentFilter !== 'all'){
    rows = rows.filter(r => r.sample.toLowerCase().includes(currentFilter.toLowerCase()));
  }

  if(currentSort === 'rq') rows.sort((a,b)=>sortDir*(a.rq-b.rq));
  else if(currentSort === 'rz') rows.sort((a,b)=>sortDir*(a.rz-b.rz));
  else rows.sort((a,b)=>sortDir*(a.sample.localeCompare(b.sample)||a.profile.localeCompare(b.profile)));

  const tbody = document.getElementById('tbody');
  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" class="empty">No results</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r=>{
    const ncVal = nc(0.5, r.rq);
    const ncClass = ncVal >= 0.9 ? 'nc-good' : 'nc-warn';
    const barW = Math.min(100, (r.rq/RQ_MAX)*100);
    const rqColor = r.rq < 1 ? '#1D9E75' : r.rq < 1.5 ? '#639922' : '#BA7517';
    return `<tr>
      <td><span class="sample-name">${r.sample}</span></td>
      <td><span class="profile-tag">${r.profile}</span></td>
      <td>
        <div class="rq-bar-wrap">
          <div class="rq-bar" style="width:${barW}%;background:${rqColor}"></div>
          <span class="rq-val" style="color:${rqColor}">${r.rq.toFixed(3)}</span>
        </div>
      </td>
      <td>${r.ra.toFixed(3)}</td>
      <td>${r.rz.toFixed(3)}</td>
      <td><span class="${ncClass}">${ncVal.toFixed(3)}</span></td>
      <td style="display:flex;gap:4px;flex-wrap:wrap">
        <a class="link-btn" href="${r.afm}"><span class="link-icon">⬡</span>AFM</a>
        <a class="link-btn" href="${r.graph}"><span class="link-icon">∿</span>Profile</a>
      </td>
    </tr>`;
  }).join('');
}

// filter pills
document.querySelectorAll('[data-filter]').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on'));
    p.classList.add('on');
    currentFilter = p.dataset.filter;
    render();
  });
});

// sort buttons
document.querySelectorAll('.sort-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    if(currentSort === b.dataset.sort) sortDir *= -1;
    else { currentSort = b.dataset.sort; sortDir = 1; }
    document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render();
  });
});

// column header sort
document.querySelectorAll('th[data-col]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col = th.dataset.col;
    if(currentSort===col) sortDir*=-1; else {currentSort=col;sortDir=1;}
    document.querySelectorAll('th').forEach(t=>t.classList.remove('sorted'));
    th.classList.add('sorted');
    render();
  });
});

render();
</script>
