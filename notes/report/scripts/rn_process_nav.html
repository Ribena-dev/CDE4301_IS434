<style>
.right-nav{
  position:fixed;
  top:50%;
  right:16px;
  transform:translateY(-50%);
  width:110px;
  border-left:0.5px solid var(--color-border-tertiary);
  padding:12px 0;
  background:var(--color-background-primary);
  border-radius:8px;
  border:0.5px solid var(--color-border-tertiary);
  z-index:100;
}
.r-title{font-size:9px;font-weight:500;color:#999;text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px}
.r-item{display:block;cursor:pointer;padding:6px 10px;border-right:2px solid transparent;transition:all .15s}
.r-item:hover{background:#f5f5f5}
.r-item.active{border-right-color:#000;background:#f5f5f5}
.r-svg{width:100%;height:28px;display:block;margin-bottom:3px}
.r-label{font-size:9px;font-weight:500;color:#888;display:block;transition:color .2s;line-height:1.3}
.r-item.active .r-label{color:#111}
.r-sub{font-size:8px;color:#aaa;display:block;line-height:1.3}
.r-divider{height:0.5px;background:#e5e5e5;margin:4px 10px}
</style>

<nav class="right-nav">
  <div class="r-title">Process</div>

  <div class="r-item active" onclick="rJump('substrate')">
    <svg class="r-svg" viewBox="0 0 90 28">
      <rect x="4" y="16" width="82" height="9" rx="2" fill="#5DCAA5" opacity="0.5"/>
      <rect x="4" y="9" width="82" height="7" rx="1" fill="#888780" opacity="0.45"/>
    </svg>
    <span class="r-label">Substrate</span>
    <span class="r-sub">Seed + Si wafer</span>
  </div>
  <div class="r-divider"></div>

  <div class="r-item" onclick="rJump('resist')">
    <svg class="r-svg" viewBox="0 0 90 28">
      <rect x="4" y="16" width="82" height="9" rx="2" fill="#5DCAA5" opacity="0.5"/>
      <rect x="4" y="9" width="82" height="7" rx="1" fill="#888780" opacity="0.4"/>
      <rect x="4" y="3" width="82" height="6" rx="1" fill="#EF9F27" opacity="0.45"/>
    </svg>
    <span class="r-label">Resist coating</span>
    <span class="r-sub">PMMA spin-on</span>
  </div>
  <div class="r-divider"></div>

  <div class="r-item" onclick="rJump('pbw')">
    <svg class="r-svg" viewBox="0 0 90 28">
      <rect x="4" y="16" width="82" height="9" rx="2" fill="#5DCAA5" opacity="0.5"/>
      <rect x="4" y="9" width="82" height="7" rx="1" fill="#888780" opacity="0.4"/>
      <rect x="4" y="3" width="82" height="6" rx="1" fill="#EF9F27" opacity="0.4"/>
      <line x1="25" y1="0" x2="25" y2="4" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="2 1" opacity="0.9"/>
      <line x1="45" y1="0" x2="45" y2="4" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="2 1" opacity="0.9"/>
      <line x1="65" y1="0" x2="65" y2="4" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="2 1" opacity="0.9"/>
    </svg>
    <span class="r-label">PBW exposure</span>
    <span class="r-sub">Step 3a</span>
  </div>
  <div class="r-divider"></div>

  <div class="r-item" onclick="rJump('develop')">
    <svg class="r-svg" viewBox="0 0 90 28">
      <rect x="4" y="16" width="82" height="9" rx="2" fill="#5DCAA5" opacity="0.5"/>
      <rect x="4" y="9" width="82" height="7" rx="1" fill="#888780" opacity="0.4"/>
      <rect x="4" y="3" width="16" height="6" rx="1" fill="#EF9F27" opacity="0.5"/>
      <rect x="30" y="3" width="16" height="6" rx="1" fill="#EF9F27" opacity="0.5"/>
      <rect x="56" y="3" width="16" height="6" rx="1" fill="#EF9F27" opacity="0.5"/>
      <rect x="72" y="3" width="14" height="6" rx="1" fill="#EF9F27" opacity="0.5"/>
    </svg>
    <span class="r-label">Development</span>
    <span class="r-sub">Step 3b</span>
  </div>
  <div class="r-divider"></div>

  <div class="r-item" onclick="rJump('plating')">
    <svg class="r-svg" viewBox="0 0 90 28">
      <rect x="4" y="18" width="82" height="8" rx="2" fill="#5DCAA5" opacity="0.5"/>
      <rect x="4" y="11" width="82" height="7" rx="1" fill="#888780" opacity="0.4"/>
      <rect x="6" y="5" width="14" height="6" rx="1" fill="#444441" opacity="0.7"/>
      <rect x="30" y="5" width="14" height="6" rx="1" fill="#444441" opacity="0.7"/>
      <rect x="54" y="5" width="14" height="6" rx="1" fill="#444441" opacity="0.7"/>
    </svg>
    <span class="r-label">Ni plate + liftoff</span>
    <span class="r-sub">Step 4</span>
  </div>
  <div class="r-divider"></div>

  <div class="r-item" onclick="rJump('analysis')">
    <svg class="r-svg" viewBox="0 0 90 28">
      <polyline points="6,24 18,14 30,19 46,8 60,13 82,4" fill="none" stroke="#1D9E75" stroke-width="1.3" opacity="0.7" stroke-linejoin="round"/>
      <line x1="6" y1="24" x2="82" y2="24" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
      <line x1="6" y1="3" x2="6" y2="24" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
    </svg>
    <span class="r-label">Analysis</span>
    <span class="r-sub">AFM + SEM</span>
  </div>

</nav>

<script>
const rSections = ['substrate','resist','pbw','develop','material deposition','analysis'];
const rItems = document.querySelectorAll('.r-item');

function updateR() {
  let idx = 0;
  rSections.forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.getBoundingClientRect().top <= 80) idx = i;
  });
  rItems.forEach((r, i) => r.classList.toggle('active', i === idx));
}

window.addEventListener('scroll', updateR, {passive: true});

function rJump(id) {
  const el = document.getElementById(id);
  if (!el) return;
  window.scrollTo({top: el.offsetTop - 60, behavior: 'smooth'});
}

updateR();
</script>
