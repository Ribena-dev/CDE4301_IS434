
<style>
.ctrl{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:var(--color-text-secondary);}
.ctrl label{width:160px;flex-shrink:0;}
.ctrl span{min-width:52px;font-size:13px;font-weight:500;color:var(--color-text-primary);}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:4px;}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary);}
.leg-sq{width:24px;height:3px;border-radius:2px;}
.annotation{font-size:11px;color:var(--color-text-secondary);margin-top:6px;text-align:center;}
</style>

<div class="ctrl">
  <label>EBL voltage (keV)</label>
  <input type="range" id="kev" min="10" max="100" value="30" step="5" style="flex:1;">
  <span id="kev-out">30 keV</span>
</div>
<div class="ctrl">
  <label>Resist depth shown (nm)</label>
  <input type="range" id="depth" min="200" max="2000" value="1000" step="100" style="flex:1;">
  <span id="dep-out">1000 nm</span>
</div>

<div class="legend-row">
  <div class="leg"><div class="leg-sq" style="background:#E24B4A;"></div>EBL electrons (selected keV)</div>
  <div class="leg"><div class="leg-sq" style="background:#A32D2D;"></div>EBL 100 keV reference</div>
  <div class="leg"><div class="leg-sq" style="background:#888780;height:1px;"></div>1 µm resist depth</div>
</div>

<div style="position:relative;width:100%;height:320px;">
  <canvas id="c"></canvas>
</div>

<div style="display:flex;gap:24px;margin-top:12px;">
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 16px;flex:1;text-align:center;">
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px;">EBL spread at 1 µm</div>
    <div id="ebl-val" style="font-size:20px;font-weight:500;color:#E24B4A;">—</div>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 16px;flex:1;text-align:center;">
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:2px;">EBL 100 keV at 1 µm</div>
    <div id="ebl100-val" style="font-size:20px;font-weight:500;color:#A32D2D;">—</div>
  </div>
</div>
<p class="annotation">Lateral spread σ(z) modelled using the Everhart–Hoff empirical electron scattering relation.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
function eblRange(keV){ return 0.0276*Math.pow(keV,1.75)*1000; }
function eblSpread(z,keV){
  const R=eblRange(keV), t=z/R;
  if(t>=1) return R*0.35;
  return Math.max(1, R*0.018*Math.pow(t,0.9)*Math.exp(2.1*t));
}
const N=80;
function makeDepths(maxD){ return Array.from({length:N},(_,i)=>Math.round((i/(N-1))*maxD)); }

let chart;
function initChart(){
  const ctx=document.getElementById('c').getContext('2d');
  chart=new Chart(ctx,{
    type:'line',
    data:{labels:[],datasets:[
      {label:'EBL (selected keV)',data:[],borderColor:'#E24B4A',backgroundColor:'rgba(226,75,74,0.08)',fill:false,tension:0.3,borderWidth:2.5,pointRadius:0},
      {label:'EBL 100 keV',data:[],borderColor:'#A32D2D',fill:false,tension:0.3,borderWidth:1.5,borderDash:[6,4],pointRadius:0},
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:200},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y.toFixed(1)} nm`}}},
      scales:{
        x:{title:{display:true,text:'Depth in PMMA (nm)',font:{size:12}},ticks:{maxTicksLimit:8}},
        y:{title:{display:true,text:'Lateral spread σ (nm)',font:{size:12}},min:0,ticks:{callback:v=>v.toFixed(0)+' nm'}}
      }
    }
  });
}

function update(){
  const keV=+document.getElementById('kev').value;
  const maxD=+document.getElementById('depth').value;
  document.getElementById('kev-out').textContent=keV+' keV';
  document.getElementById('dep-out').textContent=maxD+' nm';

  const depths=makeDepths(maxD);
  chart.data.labels=depths;
  chart.data.datasets[0].data=depths.map(d=>+eblSpread(d,keV).toFixed(2));
  chart.data.datasets[1].data=depths.map(d=>+eblSpread(d,100).toFixed(2));

  const yMax=Math.max(...chart.data.datasets[0].data)*1.1;
  chart.options.scales.y.max=Math.round(yMax);
  chart.update();

  document.getElementById('ebl-val').textContent=eblSpread(1000,keV).toFixed(0)+' nm';
  document.getElementById('ebl100-val').textContent=eblSpread(1000,100).toFixed(0)+' nm';
}

initChart(); update();
document.getElementById('kev').addEventListener('input',update);
document.getElementById('depth').addEventListener('input',update);
</script>
