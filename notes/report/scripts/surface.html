<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:16px 20px;font-family:var(--font-sans)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ctrl-label{font-size:11px;color:var(--color-text-tertiary)}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .15s;user-select:none}
.pill.on{background:var(--color-background-primary);border-color:var(--color-text-primary);color:var(--color-text-primary)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--color-text-secondary)}
th.sorted{color:var(--color-text-primary)}
td{padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.meas-name{font-weight:500;color:var(--color-text-primary);font-size:12px;cursor:pointer;border-bottom:1px dashed #ccc;transition:border-color .15s}
.meas-name:hover{text-decoration:underline;text-decoration-style:dotted}
.theta-val{font-weight:600;font-size:13px}
.fwhm-val{font-size:12px;color:var(--color-text-secondary)}
.flag-pass{color:#1D9E75;font-weight:600}
.flag-fail{color:#BA7517;font-weight:500}
.flag-theory{color:#888;font-style:italic}
.srim-row td{background:var(--color-background-secondary);font-style:italic}
.empty{padding:24px;text-align:center;font-size:12px;color:var(--color-text-tertiary)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--color-background-secondary);border-radius:8px;padding:8px 12px}
.stat-n{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.stat-l{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.note{font-size:11px;color:var(--color-text-tertiary);margin-top:12px;padding:8px 12px;border-left:2px solid var(--color-border-tertiary);line-height:1.6}

/* theta bar */
.theta-bar-wrap{display:flex;align-items:center;gap:6px}
.theta-bar-track{flex:1;height:6px;border-radius:3px;background:var(--color-background-secondary);position:relative}
.theta-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.theta-target{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:#1D9E75;opacity:0.6}

/* lightbox */
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center}
.lb-overlay.open{display:flex}
.lb-box{background:#fff;border-radius:12px;padding:24px;max-width:860px;width:92vw;max-height:88vh;overflow-y:auto;position:relative}
.lb-close{position:absolute;top:14px;right:16px;font-size:20px;cursor:pointer;color:#aaa;background:none;border:none;padding:0;line-height:1}
.lb-close:hover{color:#111}
.lb-title{font-size:14px;font-weight:500;color:#111;margin-bottom:3px;padding-right:28px}
.lb-subtitle{font-size:11px;color:#999;margin-bottom:14px}
.lb-metrics{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.lb-metric{display:flex;flex-direction:column;gap:2px}
.lb-metric-val{font-weight:500;color:#111;font-size:14px}
.lb-metric-key{font-size:10px;color:#aaa}
.lb-imgs{display:grid;gap:14px}
.lb-imgs.one{grid-template-columns:1fr}
.lb-imgs.two{grid-template-columns:1fr 1fr}
.lb-imgs img{width:100%;border-radius:8px;border:0.5px solid #e5e5e5;display:block}
.lb-img-wrap{display:flex;flex-direction:column;gap:5px}
.lb-img-label{font-size:10px;color:#aaa;text-align:center}
@media(max-width:580px){.lb-imgs.two{grid-template-columns:1fr}}
</style>

<!-- lightbox -->
<div class="lb-overlay" id="lb-overlay" onclick="closeLB(event)">
  <div class="lb-box">
    <button class="lb-close" onclick="closeLB(null)">✕</button>
    <div class="lb-title" id="lb-title"></div>
    <div class="lb-subtitle" id="lb-subtitle"></div>
    <div class="lb-metrics" id="lb-metrics"></div>
    <div class="lb-imgs" id="lb-imgs"></div>
  </div>
</div>

<div class="wrap">

  <div class="summary" id="summary">
    <div class="stat"><div class="stat-n" style="color:#1D9E75">2 / 3</div><div class="stat-l">meet ≥89.4°</div></div>
    <div class="stat"><div class="stat-n" style="color:#1D9E75">89.66°</div><div class="stat-l">best measured</div></div>
    <div class="stat"><div class="stat-n" style="color:#888">89.9°</div><div class="stat-l">SRIM prediction</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Measurement ↕</th>
        <th>f (nm)</th>
        <th>θ (°)</th>
        <th>Meets ≥89.4°</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="note">
    SRIM theoretical prediction: θ = 89.9° (f = 1.91 nm at h = 1000 nm), assuming perfect beam focus and negligible broadening. Click any row to view the edge fit graph.
  </div>

</div>

<script>
const THETA_MIN = 88.8;
const THETA_MAX = 90.0;
const TARGET = 89.4;

const data = [
  {
    label: 'DLC/Au boundary',
    f: 40.93, theta: 89.66, pass: true,
    imgs: [
      {src: '../images/dlc_au_boundary.png', caption: 'Erf+Gaussian fit — DLC/Au boundary edge'}
    ],
    note: 'Single edge measurement at the DLC-on-Au interface. Erf+Gaussian fit converged cleanly with a well-defined edge peak.'
  },
  {
    label: 'DLC (position 1)',
    f: 45.91, theta: 89.49, pass: true,
    imgs: [
      {src: '../images/2012_6_385_graph.png', caption: 'Edge fit — PMMA sidewall, position 1'}
    ],
    note: 'Measured on the PMMA sidewall prior to DLC deposition at measurement position 1.'
  },
  {
    label: 'DLC (position 2)',
    f: 45.91, theta: 89.49, pass: true,
    imgs: [
      {src: '../images/2012_6_41_graph.png', caption: 'Edge fit — PMMA sidewall, position 2'}
    ],
    note: 'Measured on the PMMA sidewall prior to DLC deposition at measurement position 2.'
  },
  {
    label: 'DLC on Pd',
    f: 60.30, theta: 89.12, pass: false,
    imgs: [],
    note: 'Marginally below the 89.4° target. The wider f is consistent with a slightly less sharp edge, possibly reflecting the Pd seed layer surface roughness contribution.'
  },
  {
    label: 'SRIM prediction',
    f: 1.91, theta: 89.9, pass: null,
    imgs: [],
    note: 'Monte Carlo simulation (SRIM) for 2 MeV protons in 1 µm PMMA. Represents the theoretical upper bound with perfect beam focus.'
  },
];

function thetaColor(theta, pass){
  if(pass === null) return '#888';
  if(pass) return '#1D9E75';
  return '#BA7517';
}

function openLB(r){
  document.getElementById('lb-title').textContent = r.label;
  document.getElementById('lb-subtitle').textContent = r.note;

  const col = thetaColor(r.theta, r.pass);
  const passLabel = r.pass === null
    ? 'Theory'
    : r.pass ? '✓ meets target' : '✗ below target';

  document.getElementById('lb-metrics').innerHTML = `
    <div class="lb-metric">
      <span class="lb-metric-val" style="color:${col}">${r.theta.toFixed(2)}°</span>
      <span class="lb-metric-key">Sidewall angle θ</span>
    </div>
    <div class="lb-metric">
      <span class="lb-metric-val">${r.f.toFixed(2)} nm</span>
      <span class="lb-metric-key">FWHM f</span>
    </div>
    <div class="lb-metric">
      <span class="lb-metric-val" style="color:${col}">${passLabel}</span>
      <span class="lb-metric-key">≥89.4° target</span>
    </div>`;

  const imgBox = document.getElementById('lb-imgs');
  if(!r.imgs || r.imgs.length === 0){
    imgBox.className = 'lb-imgs one';
    imgBox.innerHTML = `<div style="padding:24px;text-align:center;font-size:12px;color:#aaa;">No edge fit image available for this measurement.</div>`;
  } else {
    imgBox.className = r.imgs.length === 1 ? 'lb-imgs one' : 'lb-imgs two';
    imgBox.innerHTML = r.imgs.map(im =>
      `<div class="lb-img-wrap">
        <img src="${im.src}" alt="${im.caption}" onerror="this.style.display='none';this.nextElementSibling.textContent='Image not found — check path'">
        <div class="lb-img-label">${im.caption}</div>
      </div>`
    ).join('');
  }

  document.getElementById('lb-overlay').classList.add('open');
}

function closeLB(e){
  if(e && e.target !== document.getElementById('lb-overlay')) return;
  document.getElementById('lb-overlay').classList.remove('open');
}

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') document.getElementById('lb-overlay').classList.remove('open');
});

function render(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = data.map((r, i) => {
    const col = thetaColor(r.theta, r.pass);
    const isTheory = r.pass === null;

    // theta bar: fill from 88.8 to actual theta, marker at 89.4
    const fillPct = Math.min(100, Math.max(0, (r.theta - THETA_MIN) / (THETA_MAX - THETA_MIN) * 100));
    const targetPct = (TARGET - THETA_MIN) / (THETA_MAX - THETA_MIN) * 100;

    const passCell = isTheory
      ? `<span class="flag-theory">theory</span>`
      : r.pass
        ? `<span class="flag-pass">✓</span>`
        : `<span class="flag-fail">✗</span>`;

    const hasImg = r.imgs && r.imgs.length > 0;
    const hint = hasImg ? ` <span style="font-size:9px;color:#bbb">⬡</span>` : '';

    return `<tr class="${isTheory ? 'srim-row' : ''}" style="cursor:pointer" onclick="openLB(data[${i}])">
      <td><span class="meas-name">${r.label}${hint}</span></td>
      <td class="fwhm-val">${r.f.toFixed(2)}</td>
      <td>
        <div class="theta-bar-wrap">
          <div class="theta-bar-track" style="width:80px">
            <div class="theta-bar-fill" style="width:${fillPct}%;background:${col}"></div>
            <div class="theta-target" style="left:${targetPct}%"></div>
          </div>
          <span class="theta-val" style="color:${col}">${r.theta.toFixed(2)}°</span>
        </div>
      </td>
      <td>${passCell}</td>
    </tr>`;
  }).join('');
}

render();
</script>
