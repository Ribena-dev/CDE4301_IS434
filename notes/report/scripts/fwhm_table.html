<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:16px 20px;font-family:var(--font-sans)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ctrl-label{font-size:11px;color:var(--color-text-tertiary);margin-right:2px}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .15s;user-select:none}
.pill.on{background:var(--color-text-primary);border-color:var(--color-text-primary);color:var(--color-background-primary)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--color-text-secondary)}
th.sorted{color:var(--color-text-primary)}
th .sort-arrow{margin-left:3px;opacity:0.4;font-size:9px}
th.sorted .sort-arrow{opacity:1}
td{padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.grid-pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.axis-badge{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--color-background-secondary);color:var(--color-text-secondary);font-weight:500}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--color-background-secondary);border-radius:8px;padding:8px 12px}
.stat-n{font-size:18px;font-weight:500}
.stat-l{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.avgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.avg-card{background:var(--color-background-secondary);border-radius:8px;padding:8px 12px}
.avg-title{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.avg-row{display:flex;justify-content:space-between;font-size:11px;color:var(--color-text-secondary);padding:2px 0}
.avg-val{font-weight:500;color:var(--color-text-primary)}
.empty{padding:24px;text-align:center;font-size:12px;color:var(--color-text-tertiary)}
.note{font-size:11px;color:var(--color-text-tertiary);margin-top:12px;padding:8px 12px;border-left:2px solid var(--color-border-tertiary);line-height:1.6}
</style>

<div class="wrap">

  <div class="summary" id="summary"></div>

  <div class="controls">
    <span class="ctrl-label">Grid:</span>
    <span class="pill on" data-filter="grid" data-val="all" onclick="setFilter('grid','all',this)">All</span>
    <span class="pill" data-filter="grid" data-val="Grid-14" onclick="setFilter('grid','Grid-14',this)">Grid-14</span>
    <span class="pill" data-filter="grid" data-val="Grid-12" onclick="setFilter('grid','Grid-12',this)">Grid-12</span>

    <span class="ctrl-label" style="margin-left:8px">Axis:</span>
    <span class="pill on" data-filter="axis" data-val="all" onclick="setFilter('axis','all',this)">All</span>
    <span class="pill" data-filter="axis" data-val="X" onclick="setFilter('axis','X',this)">X</span>
    <span class="pill" data-filter="axis" data-val="Y" onclick="setFilter('axis','Y',this)">Y</span>
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="sortBy('grid')">Grid <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('sel')">Sel <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('axis')">Axis <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('fwhm')">FWHM (nm) <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('fwhm2')">FWHM/2 (nm) <span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="avgs" id="avgs"></div>

  <div class="note">
    nm/px = 0.94 · FWHM/2 represents the half-width of the edge transition, comparable to the SEM beam spot size.
  </div>
</div>

<script>
const gridStyle = {
  'Grid-14': {bg:'#E1F5EE', fg:'#0F6E56'},
  'Grid-12': {bg:'#FAEEDA', fg:'#854F0B'},
};

const raw = [
  {grid:'Grid-14', sel:1, axis:'Y', fwhm:47.73, fwhm2:23.87},
  {grid:'Grid-14', sel:2, axis:'Y', fwhm:43.15, fwhm2:21.58},
  {grid:'Grid-14', sel:3, axis:'Y', fwhm:41.82, fwhm2:20.91},
  {grid:'Grid-14', sel:4, axis:'X', fwhm:73.00, fwhm2:36.50},
  {grid:'Grid-14', sel:5, axis:'X', fwhm:82.55, fwhm2:41.28},
  {grid:'Grid-14', sel:6, axis:'X', fwhm:96.74, fwhm2:48.37},
  {grid:'Grid-12', sel:1, axis:'Y', fwhm:39.41, fwhm2:19.71},
  {grid:'Grid-12', sel:2, axis:'Y', fwhm:42.74, fwhm2:21.37},
  {grid:'Grid-12', sel:3, axis:'Y', fwhm:47.55, fwhm2:23.78},
  {grid:'Grid-12', sel:4, axis:'X', fwhm:106.22, fwhm2:53.11},
  {grid:'Grid-12', sel:5, axis:'X', fwhm:91.92,  fwhm2:45.96},
  {grid:'Grid-12', sel:6, axis:'X', fwhm:100.57, fwhm2:50.29},
];

const filters = {grid:'all', axis:'all'};
let sortKey = null, sortDir = 1;

function avg(arr){ return arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : null; }
function fmt(v){ return v !== null ? v.toFixed(2) : '—'; }

function setFilter(type, val, el){
  filters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  render();
}

function sortBy(key){
  if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('sorted');
    const a = th.querySelector('.sort-arrow'); if(a) a.textContent = '↕';
  });
  const keyMap = {grid:0,sel:1,axis:2,fwhm:3,fwhm2:4};
  const ths = document.querySelectorAll('th');
  if(keyMap[key] !== undefined){
    ths[keyMap[key]].classList.add('sorted');
    const a = ths[keyMap[key]].querySelector('.sort-arrow');
    if(a) a.textContent = sortDir === 1 ? '↑' : '↓';
  }
  render();
}

function render(){
  let rows = raw.filter(r =>
    (filters.grid === 'all' || r.grid === filters.grid) &&
    (filters.axis === 'all' || r.axis === filters.axis)
  );

  if(sortKey){
    rows = [...rows].sort((a,b) => {
      const av = a[sortKey], bv = b[sortKey];
      return typeof av === 'string' ? sortDir * av.localeCompare(bv) : sortDir * (av - bv);
    });
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.length === 0
    ? '<tr><td colspan="5" class="empty">No results match the current filters</td></tr>'
    : rows.map(r => {
        const gs = gridStyle[r.grid];
        return `<tr>
          <td><span class="grid-pill" style="background:${gs.bg};color:${gs.fg}">${r.grid}</span></td>
          <td>${r.sel}</td>
          <td><span class="axis-badge">${r.axis}</span></td>
          <td>${r.fwhm.toFixed(2)}</td>
          <td>${r.fwhm2.toFixed(2)}</td>
        </tr>`;
      }).join('');

  // summary cards
  const n = rows.length;
  const avgF2  = avg(rows.map(r=>r.fwhm2));
  const avgFwh = avg(rows.map(r=>r.fwhm));
  document.getElementById('summary').innerHTML = n === 0 ? '' : `
    <div class="stat"><div class="stat-n">${n}</div><div class="stat-l">selections shown</div></div>
    <div class="stat"><div class="stat-n">${fmt(avgFwh)} nm</div><div class="stat-l">avg FWHM</div></div>
    <div class="stat"><div class="stat-n">${fmt(avgF2)} nm</div><div class="stat-l">avg FWHM/2</div></div>`;

  // averages breakdown — always computed from full dataset for context
  const xRows = raw.filter(r =>
    (filters.grid==='all'||r.grid===filters.grid) && r.axis==='X');
  const yRows = raw.filter(r =>
    (filters.grid==='all'||r.grid===filters.grid) && r.axis==='Y');
  const allRows = raw.filter(r =>
    (filters.grid==='all'||r.grid===filters.grid));

  document.getElementById('avgs').innerHTML = `
    <div class="avg-card">
      <div class="avg-title">Y scans</div>
      <div class="avg-row"><span>Avg FWHM</span><span class="avg-val">${fmt(avg(yRows.map(r=>r.fwhm)))} nm</span></div>
      <div class="avg-row"><span>Avg FWHM/2</span><span class="avg-val">${fmt(avg(yRows.map(r=>r.fwhm2)))} nm</span></div>
      <div class="avg-row"><span>n</span><span class="avg-val">${yRows.length}</span></div>
    </div>
    <div class="avg-card">
      <div class="avg-title">X scans</div>
      <div class="avg-row"><span>Avg FWHM</span><span class="avg-val">${fmt(avg(xRows.map(r=>r.fwhm)))} nm</span></div>
      <div class="avg-row"><span>Avg FWHM/2</span><span class="avg-val">${fmt(avg(xRows.map(r=>r.fwhm2)))} nm</span></div>
      <div class="avg-row"><span>n</span><span class="avg-val">${xRows.length}</span></div>
    </div>
    <div class="avg-card">
      <div class="avg-title">All (X + Y)</div>
      <div class="avg-row"><span>Avg FWHM</span><span class="avg-val">${fmt(avg(allRows.map(r=>r.fwhm)))} nm</span></div>
      <div class="avg-row"><span>Avg FWHM/2</span><span class="avg-val">${fmt(avg(allRows.map(r=>r.fwhm2)))} nm</span></div>
      <div class="avg-row"><span>n</span><span class="avg-val">${allRows.length}</span></div>
    </div>`;
}

render();
</script>
