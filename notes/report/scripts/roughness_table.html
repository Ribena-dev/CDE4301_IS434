<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:16px 20px;font-family:var(--font-sans)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ctrl-label{font-size:11px;color:var(--color-text-tertiary)}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .15s;user-select:none}
.pill.on{background:var(--color-background-primary);border-color:var(--color-text-primary);color:var(--color-text-primary)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--color-text-secondary)}
th.sorted{color:var(--color-text-primary)}
td{padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.sample-name{font-weight:500;color:var(--color-text-primary);font-size:12px}
.profile-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);color:var(--color-text-tertiary)}
.rq-bar-wrap{display:flex;align-items:center;gap:6px}
.rq-bar{height:6px;border-radius:3px;transition:width .3s;min-width:2px}
.rq-val{font-size:11px;font-weight:500;min-width:40px}
.flag-pass{color:#1D9E75;font-weight:500}
.flag-fail{color:#BA7517}
.empty{padding:24px;text-align:center;font-size:12px;color:var(--color-text-tertiary)}
.legend{display:flex;gap:14px;margin-top:12px;font-size:10px;color:var(--color-text-tertiary);flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--color-background-secondary);border-radius:8px;padding:8px 12px}
.stat-n{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.stat-l{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}

/* lightbox */
.sample-link{cursor:pointer;text-decoration:none;border-bottom:1px dashed #ccc;transition:border-color .15s}
.sample-link:hover .sample-name{text-decoration:underline;text-decoration-style:dotted}
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center}
.lb-overlay.open{display:flex}
.lb-box{background:#fff;border-radius:12px;padding:24px;max-width:880px;width:92vw;max-height:88vh;overflow-y:auto;position:relative}
.lb-close{position:absolute;top:14px;right:16px;font-size:20px;cursor:pointer;color:#aaa;background:none;border:none;padding:0;line-height:1}
.lb-close:hover{color:#111}
.lb-title{font-size:14px;font-weight:500;color:#111;margin-bottom:3px;padding-right:28px}
.lb-subtitle{font-size:11px;color:#999;margin-bottom:16px}
.lb-imgs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lb-imgs img{width:100%;border-radius:8px;border:0.5px solid #e5e5e5;display:block}
.lb-img-wrap{display:flex;flex-direction:column;gap:5px}
.lb-img-label{font-size:10px;color:#aaa;text-align:center}
.lb-metrics{display:flex;gap:16px;margin-bottom:16px;font-size:12px;color:#666}
.lb-metric{display:flex;flex-direction:column;gap:2px}
.lb-metric-val{font-weight:500;color:#111;font-size:14px}
.lb-metric-key{font-size:10px;color:#aaa}
@media(max-width:580px){.lb-imgs{grid-template-columns:1fr}}
</style>

<!-- lightbox overlay -->
<div class="lb-overlay" id="lb-overlay" onclick="closeLB(event)">
  <div class="lb-box" id="lb-box">
    <button class="lb-close" onclick="closeLB(null)">✕</button>
    <div class="lb-title" id="lb-title"></div>
    <div class="lb-subtitle" id="lb-subtitle"></div>
    <div class="lb-metrics" id="lb-metrics"></div>
    <div class="lb-imgs" id="lb-imgs"></div>
  </div>
</div>

<div class="wrap">
  <div class="summary" id="summary"></div>
  <div class="controls">
    <span class="ctrl-label">Filter:</span>
    <span class="pill on" data-filter="all">All</span>
    <span class="pill" data-filter="Pd">Pd</span>
    <span class="pill" data-filter="Au">Au</span>
    <span class="pill" data-filter="DLC">DLC</span>
    <span class="pill" data-filter="Si">Si</span>
    <span class="ctrl-label" style="margin-left:8px">Show only &lt;1 nm:</span>
    <span class="pill" data-filter="pass" id="pass-pill">✓ passing</span>
  </div>

  <table>
    <thead>
      <tr>
        <th data-col="sample">Sample ↕</th>
        <th data-col="profile">Profile ↕</th>
        <th data-col="rq">Rq (nm) ↕</th>
        <th>&lt;1 nm target</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#1D9E75"></div>Rq &lt; 0.5 nm — excellent</div>
    <div class="leg"><div class="leg-dot" style="background:#639922"></div>0.5–1.0 nm — good</div>
    <div class="leg"><div class="leg-dot" style="background:#BA7517"></div>1.0–2.0 nm — marginal</div>
    <div class="leg"><div class="leg-dot" style="background:#D85A30"></div>&gt; 2.0 nm — exceeds target</div>
  </div>
</div>

<script>
const data = [
  {sample:'Si surface',    profile:'P1', rq:0.164, ra:0.131, rz:1.076,
   afm:'afm/si.png', graph:'images/Si_surface_afm.png'},

  {sample:'Pd 500nm',      profile:'P1', rq:0.176, ra:0.144, rz:0.925,
   afm:'images/Pd_si_500nm_0_afm.png', graph:'images/pd_500nm_graph_2_afm.png'},
  {sample:'Pd 500nm',      profile:'P2', rq:0.223, ra:0.182, rz:1.171,
   afm:'images/Pd_si_500nm_0_afm.png', graph:'images/pd_500nm_graph_2_afm.png'},
  {sample:'Pd 500nm',      profile:'P3', rq:1.848, ra:1.484, rz:8.553,
   afm:'images/Pd_si_500nm_0_afm.png', graph:'images/pd_500nm_graph_2_afm.png'},

  {sample:'Pd 5µm',        profile:'P1', rq:0.148, ra:0.120, rz:0.806,
   afm:'images/pd_si_5um_0_afm.png', graph:'images/pd_si_5um_0_afm.png'},
  {sample:'Pd 5µm',        profile:'P2', rq:0.165, ra:0.129, rz:0.870,
   afm:'images/pd_si_5um_0_afm.png', graph:'images/pd_si_5um_0_afm.png'},
  {sample:'Pd 5µm',        profile:'P3', rq:1.555, ra:1.297, rz:6.058,
   afm:'images/pd_si_5um_0_afm.png', graph:'images/pd_si_5um_0_afm.png'},

  {sample:'Au on Cr (01)', profile:'P1', rq:0.758, ra:0.546, rz:4.160,
   afm:'images/Au_boundary_01_graph_afm.png', graph:'images/Au_boundary_01_graph_afm.png'},
  {sample:'Au on Cr (01)', profile:'P2', rq:0.866, ra:0.709, rz:4.347,
   afm:'images/Au_boundary_01_graph_afm.png', graph:'images/Au_boundary_01_graph_afm.png'},

  {sample:'DLC on Pd',     profile:'P1', rq:1.027, ra:0.783, rz:5.889,
   afm:'images/dlc_pd_afm.png', graph:'images/dlc_boundary_00_graph_afm.png'},
  {sample:'DLC on Pd',     profile:'P2', rq:0.883, ra:0.760, rz:3.934,
   afm:'images/dlc_pd_afm.png', graph:'images/dlc_boundary_00_graph_afm.png'},

  {sample:'DLC on Au',     profile:'P1', rq:0.422, ra:0.324, rz:2.655,
   afm:'images/dlc_boundary_02_graph_afm.png', graph:'images/dlc_boundary_02_graph_afm.png'},
  {sample:'DLC on Au',     profile:'P2', rq:0.392, ra:0.311, rz:2.362,
   afm:'images/dlc_boundary_02_graph_afm.png', graph:'images/dlc_boundary_02_graph_afm.png'},
];

const RQ_MAX = 3.0;
let currentFilter = 'all';
let currentSort = 'sample';
let sortDir = 1;
let passOnly = false;

function rqColor(rq){
  if(rq < 0.5) return '#1D9E75';
  if(rq < 1.0) return '#639922';
  if(rq < 2.0) return '#BA7517';
  return '#D85A30';
}

function updateSummary(rows){
  const total = rows.length;
  const passing = rows.filter(r=>r.rq<1).length;
  const best = rows.reduce((a,b)=>a.rq<b.rq?a:b, rows[0]);
  const worst = rows.reduce((a,b)=>a.rq>b.rq?a:b, rows[0]);
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">profiles shown</div></div>
    <div class="stat"><div class="stat-n" style="color:#1D9E75">${passing}</div><div class="stat-l">below 1 nm</div></div>
    <div class="stat"><div class="stat-n" style="color:#1D9E75">${best?best.rq.toFixed(3):'—'}</div><div class="stat-l">best Rq (nm)</div></div>
    <div class="stat"><div class="stat-n" style="color:#D85A30">${worst?worst.rq.toFixed(3):'—'}</div><div class="stat-l">worst Rq (nm)</div></div>`;
}

function openLB(r){
  document.getElementById('lb-title').textContent = `${r.sample} — ${r.profile}`;
  document.getElementById('lb-subtitle').textContent = 'Click outside or ✕ to close';
  const col = rqColor(r.rq);
  document.getElementById('lb-metrics').innerHTML = `
    <div class="lb-metric"><span class="lb-metric-val" style="color:${col}">${r.rq.toFixed(3)} nm</span><span class="lb-metric-key">Rq</span></div>
    <div class="lb-metric"><span class="lb-metric-val">${r.ra.toFixed(3)} nm</span><span class="lb-metric-key">Ra</span></div>
    <div class="lb-metric"><span class="lb-metric-val">${r.rz.toFixed(3)} nm</span><span class="lb-metric-key">Rz</span></div>
    <div class="lb-metric"><span class="lb-metric-val" style="color:${col}">${r.rq<1?'✓ &lt;1 nm':'△ &gt;1 nm'}</span><span class="lb-metric-key">target</span></div>`;

  const sameImg = r.afm === r.graph;
  document.getElementById('lb-imgs').className = sameImg ? 'lb-imgs lb-single' : 'lb-imgs';
  document.getElementById('lb-imgs').innerHTML = sameImg
    ? `<div class="lb-img-wrap"><img src="${r.afm}" alt="AFM profile plot" onerror="this.style.display='none';this.nextSibling.textContent='Image not found — update path in data array'"><div class="lb-img-label">AFM profile plot</div></div>`
    : `<div class="lb-img-wrap"><img src="${r.afm}" alt="AFM scan" onerror="this.style.display='none';this.nextSibling.textContent='Image not found'"><div class="lb-img-label">AFM scan</div></div>
       <div class="lb-img-wrap"><img src="${r.graph}" alt="Profile graph" onerror="this.style.display='none';this.nextSibling.textContent='Image not found'"><div class="lb-img-label">Profile graph</div></div>`;

  document.getElementById('lb-overlay').classList.add('open');
}

function closeLB(e){
  if(e && e.target !== document.getElementById('lb-overlay')) return;
  document.getElementById('lb-overlay').classList.remove('open');
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.getElementById('lb-overlay').classList.remove('open'); });

function render(){
  let rows = [...data];
  if(passOnly) rows = rows.filter(r=>r.rq<1);
  if(currentFilter!=='all'&&currentFilter!=='pass')
    rows = rows.filter(r=>r.sample.toLowerCase().includes(currentFilter.toLowerCase()));

  if(currentSort==='rq')           rows.sort((a,b)=>sortDir*(a.rq-b.rq));
  else if(currentSort==='profile') rows.sort((a,b)=>sortDir*a.profile.localeCompare(b.profile));
  else rows.sort((a,b)=>sortDir*(a.sample.localeCompare(b.sample)||a.profile.localeCompare(b.profile)));

  updateSummary(rows);
  const tbody = document.getElementById('tbody');
  if(!rows.length){ tbody.innerHTML=`<tr><td colspan="4" class="empty">No results</td></tr>`; return; }

  tbody.innerHTML = rows.map((r,i)=>{
    const col = rqColor(r.rq);
    const barW = Math.min(100,(r.rq/RQ_MAX)*100);
    const pass = r.rq < 1;
    return `<tr>
      <td><span class="sample-name sample-link" data-idx="${i}" style="cursor:pointer;border-bottom:1px dashed #ccc">${r.sample} <span style="font-size:9px;color:#bbb">⬡</span></span></td>
      <td><span class="profile-tag">${r.profile}</span></td>
      <td><div class="rq-bar-wrap">
        <div class="rq-bar" style="width:${barW}%;background:${col}"></div>
        <span class="rq-val" style="color:${col}">${r.rq.toFixed(3)}</span>
      </div></td>
      <td class="${pass?'flag-pass':'flag-fail'}">${pass?'✓':'△'}</td>
    </tr>`;
  }).join('');

  // attach click — store filtered rows so index matches
  const filtered = rows;
  document.querySelectorAll('.sample-link').forEach(el=>{
    el.addEventListener('click',()=>openLB(filtered[+el.dataset.idx]));
  });
}

document.querySelectorAll('[data-filter]').forEach(p=>{
  p.addEventListener('click',()=>{
    const f = p.dataset.filter;
    if(f==='pass'){
      passOnly=!passOnly;
      p.classList.toggle('on',passOnly);
    } else {
      document.querySelectorAll('[data-filter]:not(#pass-pill)').forEach(x=>x.classList.remove('on'));
      p.classList.add('on');
      currentFilter=f;
    }
    render();
  });
});

document.querySelectorAll('th[data-col]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(currentSort===col) sortDir*=-1; else{currentSort=col;sortDir=1;}
    document.querySelectorAll('th').forEach(t=>t.classList.remove('sorted'));
    th.classList.add('sorted');
    render();
  });
});

render();
</script>
